<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>FlaskChat</title>

<script
    src="https://cdn.socket.io/4.8.1/socket.io.min.js">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080c12;
    color: #fff;
    font-family: Arial, sans-serif;
}

button,
input {
    font: inherit;
}

.login {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #080c12;

    z-index: 100;
}

.login-box {
    width: 90%;
    max-width: 380px;

    background: #111923;

    border: 1px solid #263442;

    border-radius: 20px;

    padding: 25px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);
}

.logo {
    text-align: center;

    font-size: 27px;
    font-weight: bold;

    margin-bottom: 8px;
}

.subtitle {
    text-align: center;

    color: #8291a3;

    margin-bottom: 22px;
}

.login input {
    width: 100%;

    padding: 14px;

    background: #18222e;

    border: 1px solid #303e4d;

    color: white;

    border-radius: 12px;

    outline: none;

    margin-bottom: 10px;
}

.login button {
    width: 100%;

    padding: 14px;

    border: 0;

    border-radius: 12px;

    background: #2478ff;

    color: white;

    font-weight: bold;
}

.app {
    height: 100vh;

    display: flex;

    flex-direction: column;
}

.header {
    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 16px;

    background: #111923;

    border-bottom: 1px solid #263442;
}

.brand {
    font-size: 20px;
    font-weight: bold;
}

.online {
    color: #48e58a;
    font-size: 12px;
}

.main {
    flex: 1;

    display: flex;

    min-height: 0;
}

.users {
    width: 270px;

    background: #0e151d;

    border-right: 1px solid #263442;

    overflow-y: auto;
}

.users-title {
    padding: 15px;

    color: #91a0b1;

    font-size: 13px;

    border-bottom: 1px solid #263442;
}

.user {
    padding: 13px;

    cursor: pointer;

    border-bottom: 1px solid #18232e;
}

.user:hover {
    background: #172330;
}

.user.active {
    background: #1d3550;
}

.user-name {
    font-weight: bold;
}

.user-ip {
    color: #77889a;

    font-size: 11px;

    margin-top: 4px;
}

.chat {
    flex: 1;

    display: flex;

    flex-direction: column;

    min-width: 0;
}

.chat-header {
    padding: 13px 16px;

    background: #111923;

    border-bottom: 1px solid #263442;
}

.chat-title {
    font-weight: bold;
}

.chat-subtitle {
    color: #77889a;

    font-size: 11px;

    margin-top: 3px;
}

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 15px;
}

.message {
    max-width: 75%;

    background: #17212b;

    border: 1px solid #263442;

    padding: 10px 13px;

    border-radius: 14px;

    margin-bottom: 10px;
}

.message.mine {
    margin-left: auto;

    background: #1855a5;
}

.message-name {
    color: #5da5ff;

    font-size: 11px;

    font-weight: bold;
}

.mine .message-name {
    color: #d6e8ff;
}

.message-text {
    margin-top: 5px;

    word-break: break-word;
}

.message-time {
    color: #7f91a3;

    font-size: 9px;

    margin-top: 5px;
}

.system {
    text-align: center;

    color: #68798a;

    font-size: 11px;

    margin: 12px;
}

.input-area {
    display: flex;

    gap: 8px;

    padding: 12px;

    background: #111923;

    border-top: 1px solid #263442;
}

.input-area input {
    flex: 1;

    min-width: 0;

    padding: 13px;

    background: #18222e;

    border: 1px solid #303e4d;

    color: white;

    outline: none;

    border-radius: 12px;
}

.send {
    padding: 0 18px;

    border: 0;

    border-radius: 12px;

    background: #2478ff;

    color: white;

    font-weight: bold;
}

@media(max-width:650px) {

    .users {
        width: 105px;
    }

    .user {
        padding: 10px 8px;
    }

    .user-ip {
        font-size: 9px;
    }

    .message {
        max-width: 88%;
    }

}

</style>

</head>

<body>


<div id="login" class="login">

    <div class="login-box">

        <div class="logo">
            ⚡ FlaskChat
        </div>

        <div class="subtitle">
            Enter your name
        </div>

        <input
            id="name"
            maxlength="30"
            placeholder="Your name..."
            onkeydown="if(event.key==='Enter') joinChat()"
        >

        <button onclick="joinChat()">
            Join Chat
        </button>

    </div>

</div>


<div class="app">

    <div class="header">

        <div class="brand">
            ⚡ FlaskChat
        </div>

        <div class="online">
            ● Online
        </div>

    </div>


    <div class="main">

        <aside class="users">

            <div class="users-title">
                👥 ONLINE USERS
            </div>

            <div id="users"></div>

        </aside>


        <section class="chat">

            <div class="chat-header">

                <div
                    id="chatTitle"
                    class="chat-title">
                    🌐 Public Chat
                </div>

                <div
                    id="chatSubtitle"
                    class="chat-subtitle">
                    Everyone
                </div>

            </div>


            <div
                id="messages"
                class="messages">
            </div>


            <div class="input-area">

                <input
                    id="message"
                    placeholder="Type message..."
                    autocomplete="off"
                    onkeydown="if(event.key==='Enter') sendMessage()"
                >

                <button
                    class="send"
                    onclick="sendMessage()">
                    Send
                </button>

            </div>

        </section>

    </div>

</div>


<script>

const socket = io();

let mySid = null;

let myName = "";

let selectedUser = null;


function joinChat() {

    const input =
        document.getElementById("name");

    const name =
        input.value.trim();

    if (!name) {
        input.focus();
        return;
    }

    myName = name;

    socket.emit("join", {
        name: name
    });

    document.getElementById("login").style.display =
        "none";
}


socket.on("me", data => {

    mySid = data.sid;

    addSystem(
        "You joined as " +
        data.name +
        " • " +
        data.ip
    );

});


socket.on("users", list => {

    const container =
        document.getElementById("users");

    container.innerHTML = "";

    list.forEach(user => {

        if (user.sid === mySid)
            return;

        const div =
            document.createElement("div");

        div.className = "user";

        if (selectedUser === user.sid)
            div.classList.add("active");

        div.onclick = () =>
            selectUser(user);

        div.innerHTML = `
            <div class="user-name">
                🟢 ${escapeHtml(user.name)}
            </div>

            <div class="user-ip">
                ${escapeHtml(user.ip)}
            </div>
        `;

        container.appendChild(div);

    });

});


function selectUser(user) {

    selectedUser = user.sid;

    document.getElementById("chatTitle")
        .textContent =
        "💬 " + user.name;

    document.getElementById("chatSubtitle")
        .textContent =
        "Private chat • " + user.ip;

    document
        .querySelectorAll(".user")
        .forEach(x =>
            x.classList.remove("active")
        );

    event.currentTarget.classList.add("active");

    addSystem(
        "Private chat with " +
        user.name
    );
}


socket.on("message", msg => {

    const messages =
        document.getElementById("messages");

    const box =
        document.createElement("div");

    box.className = "message";

    if (msg.sender_sid === mySid)
        box.classList.add("mine");

    box.innerHTML = `

        <div class="message-name">
            ${escapeHtml(msg.sender)}
        </div>

        <div class="message-text">
            ${escapeHtml(msg.text)}
        </div>

        <div class="message-time">
            ${escapeHtml(msg.time)}
        </div>

    `;

    messages.appendChild(box);

    messages.scrollTop =
        messages.scrollHeight;

});


socket.on("system", data => {

    addSystem(
        data.text +
        " • " +
        data.time
    );

});


function addSystem(text) {

    const messages =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className = "system";

    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;

}


function sendMessage() {

    const input =
        document.getElementById("message");

    const text =
        input.value.trim();

    if (!text)
        return;

    socket.emit("message", {

        text: text,

        target: selectedUser

    });

    input.value = "";

    input.focus();

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
